<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">MotoTrack daily-data entity relationship diagram</title>
  <desc id="description">Daily-only MotoTrack schema with riders, daily operations across three study groups, optional maintenance events, audit log, and three staging tables.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .entity { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 12; }
      .entity-title { fill: #dbeafe; stroke: #334155; stroke-width: 2; rx: 12; }
      .entity-name { font-size: 20px; font-weight: 700; }
      .stage-title { font-size: 16px; font-weight: 700; }
      .field { font-size: 15px; }
      .note { font-size: 14px; fill: #475569; }
      .relation { stroke: #334155; stroke-width: 2.5; fill: none; }
      .dataflow { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
      .cardinality { font-size: 14px; font-weight: 700; fill: #334155; }
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#f8fafc"/>
  <text class="title" x="60" y="58">MotoTrack — Daily Data ERD</text>
  <text class="subtitle" x="60" y="88">Daily summaries only · 2,718 source rows · baseline fuel, transition control fuel, transition electric</text>

  <rect class="entity" x="70" y="150" width="310" height="220"/>
  <rect class="entity-title" x="70" y="150" width="310" height="48"/>
  <text class="entity-name" x="90" y="181">RIDERS</text>
  <text class="field" x="90" y="228">PK  rider_id</text>
  <text class="field" x="90" y="258">UK  rider_code</text>
  <text class="field" x="90" y="288">created_at</text>

  <rect class="entity" x="520" y="125" width="610" height="610"/>
  <rect class="entity-title" x="520" y="125" width="610" height="48"/>
  <text class="entity-name" x="540" y="156">DAILY_OPERATIONS</text>
  <text class="field" x="545" y="202">PK  daily_id</text>
  <text class="field" x="545" y="231">FK  rider_id → RIDERS.rider_id</text>
  <text class="field" x="545" y="260">UK  (rider_id, source_group, operating_date)</text>
  <text class="field" x="545" y="301">source_group: BASELINE_FUEL | TRANSITION_CONTROL_FUEL</text>
  <text class="field" x="545" y="326">                 TRANSITION_TREATMENT_ELECTRIC</text>
  <text class="field" x="545" y="368">operating_date · distance_km · duration_min</text>
  <text class="field" x="545" y="397">idle_time_min · revenue_kes · maintenance_kes</text>
  <text class="field" x="545" y="438">Fuel fields (fuel groups):</text>
  <text class="field" x="565" y="465">fuel_cost_kes · fuel_unit_cost_kes_per_l · fuel_amount_l</text>
  <text class="field" x="545" y="506">Electric fields (electric group):</text>
  <text class="field" x="565" y="533">battery_swap_cost_kes · kwh_charging</text>
  <text class="field" x="545" y="574">created_at</text>
  <text class="note" x="545" y="626">Profit is derived only when revenue and applicable cost inputs</text>
  <text class="note" x="545" y="648">are complete; source blanks remain NULL.</text>

  <rect class="entity" x="70" y="500" width="310" height="270"/>
  <rect class="entity-title" x="70" y="500" width="310" height="48"/>
  <text class="entity-name" x="90" y="531">MAINTENANCE_EVENTS</text>
  <text class="field" x="90" y="579">PK  maintenance_event_id</text>
  <text class="field" x="90" y="608">FK  rider_id → RIDERS.rider_id</text>
  <text class="field" x="90" y="637">maintenance_date · maintenance_type</text>
  <text class="field" x="90" y="666">description · amount_kes · odometer_km</text>
  <text class="note" x="90" y="718">Optional manual events; daily aggregates</text>
  <text class="note" x="90" y="740">are not copied here.</text>

  <rect class="entity" x="520" y="820" width="610" height="220"/>
  <rect class="entity-title" x="520" y="820" width="610" height="48"/>
  <text class="entity-name" x="540" y="851">AUDIT_LOG</text>
  <text class="field" x="545" y="897">PK  audit_id · table_name · record_key · action_type</text>
  <text class="field" x="545" y="926">changed_by · changed_at · old_summary · new_summary</text>
  <text class="note" x="545" y="974">Standalone audit record; trigger-written, no FK.</text>

  <rect class="entity" x="1210" y="140" width="330" height="180"/>
  <rect class="entity-title" x="1210" y="140" width="330" height="48"/>
  <text class="stage-title" x="1230" y="171">STG_DAILY_BASELINE_FUEL</text>
  <text class="field" x="1230" y="218">Raw text staging for 1,480 rows</text>
  <text class="note" x="1230" y="253">Source: baseline-fuel daily CSV</text>

  <rect class="entity" x="1210" y="390" width="330" height="180"/>
  <rect class="entity-title" x="1210" y="390" width="330" height="48"/>
  <text class="stage-title" x="1230" y="421">STG_DAILY_TRANSITION_FUEL</text>
  <text class="field" x="1230" y="468">Raw text staging for 1,150 rows</text>
  <text class="note" x="1230" y="503">Source: transition-control daily CSV</text>

  <rect class="entity" x="1210" y="640" width="330" height="180"/>
  <rect class="entity-title" x="1210" y="640" width="330" height="48"/>
  <text class="stage-title" x="1230" y="671">STG_DAILY_TRANSITION_ELECTRIC</text>
  <text class="field" x="1230" y="718">Raw text staging for 88 rows</text>
  <text class="note" x="1230" y="753">Source: transition-treatment daily CSV</text>

  <path class="relation" d="M380 250 H450 V230 H520" marker-end="url(#arrow)"/>
  <text class="cardinality" x="407" y="218">1</text>
  <text class="cardinality" x="486" y="218">0..*</text>
  <text class="subtitle" x="395" y="273">has daily rows</text>

  <path class="relation" d="M225 370 V500" marker-end="url(#arrow)"/>
  <text class="cardinality" x="238" y="402">1</text>
  <text class="cardinality" x="238" y="478">0..*</text>

  <path class="dataflow" d="M1210 230 H1165 V290 H1130" marker-end="url(#arrow)"/>
  <path class="dataflow" d="M1210 480 H1170 V320 H1130" marker-end="url(#arrow)"/>
  <path class="dataflow" d="M1210 730 H1175 V350 H1130" marker-end="url(#arrow)"/>
  <text class="note" x="1155" y="865">Daily import</text>

  <path class="dataflow" d="M825 735 V820" marker-end="url(#arrow)"/>
  <text class="note" x="845" y="785">trigger</text>

  <text class="subtitle" x="70" y="1075">Scope: no TRIPS table, trip count, timestamp, GPS, or per-trip fare is loaded.</text>
</svg>
